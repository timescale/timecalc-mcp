name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test with Bun 1.4
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Lint grammar
        run: bun run grammar:lint

      - name: Run test suite
        run: bun test

      - name: Run YAML conformance runner
        run: bun run test:cases

      - name: Verify standalone executable build
        run: |
          bun run build:executables -- --target linux-amd64
          test "$(dist/timecalc-v0.0.0-linux-amd64 --version)" = "0.0.0"
          test "$(dist/timecalc-v0.0.0-linux-amd64 '(add 2025-01-31 P1M)')" = "2025-02-28"
