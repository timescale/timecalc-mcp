- description: Plain date literal
  expression: '2025-01-31'
  expected: '2025-01-31'

- description: Instant literal is normalized to UTC
  expression: '2025-06-01T12:00:00-05:00'
  expected: '2025-06-01T17:00:00Z'

- description: Zoned date-time literal preserves its zone
  expression: '2025-06-01T08:00:00-04:00[America/New_York]'
  expected: '2025-06-01T08:00:00-04:00[America/New_York]'

- description: Duration literal
  expression: 'P1M3DT4H'
  expected: 'P1M3DT4H'

- description: Add a month at the end of a month using constrained overflow
  expression: '(add 2025-01-31 P1M)'
  expected: '2025-02-28'

- description: Add a day in a leap year
  expression: '(add 2024-02-28 P1D)'
  expected: '2024-02-29'

- description: Subtract a day from a date
  expression: '(subtract 2025-03-01 P1D)'
  expected: '2025-02-28'

- description: Add one calendar day across spring-forward DST
  expression: '(add 2025-03-08T12:00:00-05:00[America/New_York] P1D)'
  expected: '2025-03-09T12:00:00-04:00[America/New_York]'

- description: Add exactly 24 elapsed hours across spring-forward DST
  expression: '(add 2025-03-08T12:00:00-05:00[America/New_York] PT24H)'
  expected: '2025-03-09T13:00:00-04:00[America/New_York]'

- description: Subtract elapsed hours from an instant
  expression: '(subtract 2025-03-01T00:00:00Z PT48H)'
  expected: '2025-02-27T00:00:00Z'

- description: Nest date arithmetic inside an inspection operator
  expression: '(day-of-week (add 2025-01-31 P1M))'
  expected: '5'

- description: Use a nested subtraction result as a duration
  expression: '(add 2025-01-01 (subtract 2025-01-03 2025-01-01))'
  expected: '2025-01-03'

- description: Subtract dates using months as the largest unit
  expression: '(subtract 2025-12-31 2025-01-01 :largest-unit "months")'
  expected: 'P11M30D'

- description: Subtract a later date to produce a negative duration
  expression: '(subtract 2025-01-01 2025-01-03)'
  expected: '-P2D'

- description: Subtract two instants using hours as the largest unit
  expression: '(subtract 2025-01-03T00:00:00Z 2025-01-01T12:00:00Z :largest-unit "hours")'
  expected: 'PT36H'

- description: Subtract zoned date-times using calendar days
  expression: '(subtract 2025-03-09T12:00:00-04:00[America/New_York] 2025-03-08T12:00:00-05:00[America/New_York] :largest-unit "days")'
  expected: 'P1D'

- description: Compare ordered dates
  expression: '(compare 2025-01-01 2025-01-02)'
  expected: '-1'

- description: Compare equivalent instants represented with different offsets
  expression: '(compare 2025-06-01T12:00:00Z 2025-06-01T08:00:00-04:00)'
  expected: '0'

- description: Compare a calendar day and 24 hours relative to a DST boundary
  expression: '(compare P1D PT24H :relative-to 2025-03-08T12:00:00-05:00[America/New_York])'
  expected: '-1'

- description: Equal dates
  expression: '(equals 2025-01-01 2025-01-01)'
  expected: 'true'

- description: Durations use structural equality
  expression: '(equals P1D PT24H)'
  expected: 'false'

- description: Round an instant to the nearest minute
  expression: '(round 2025-01-01T12:34:56Z :smallest-unit "minute")'
  expected: '2025-01-01T12:35:00Z'

- description: Round a duration to hours
  expression: '(round PT1H31M :smallest-unit "hour")'
  expected: 'PT2H'

- description: Convert an instant to a named time zone
  expression: '(with-time-zone 2025-06-01T12:00:00Z "America/New_York")'
  expected: '2025-06-01T08:00:00-04:00[America/New_York]'

- description: Change the display zone of a zoned date-time without changing its instant
  expression: '(with-time-zone 2025-06-01T08:00:00-04:00[America/New_York] "Europe/London")'
  expected: '2025-06-01T13:00:00+01:00[Europe/London]'

- description: Convert a zoned date-time to an instant
  expression: '(to-instant 2025-06-01T08:00:00-04:00[America/New_York])'
  expected: '2025-06-01T12:00:00Z'

- description: Extract the local date from a zoned date-time
  expression: '(to-date 2025-01-01T00:30:00+01:00[Europe/Paris])'
  expected: '2025-01-01'

- description: Inspect year
  expression: '(year 2025-06-01)'
  expected: '2025'

- description: Inspect month
  expression: '(month 2025-06-01)'
  expected: '6'

- description: Inspect day
  expression: '(day 2025-06-01)'
  expected: '1'

- description: Inspect zoned hour
  expression: '(hour 2025-06-01T08:02:03-04:00[America/New_York])'
  expected: '8'

- description: Inspect zoned minute
  expression: '(minute 2025-06-01T08:02:03-04:00[America/New_York])'
  expected: '2'

- description: Inspect zoned second
  expression: '(second 2025-06-01T08:02:03-04:00[America/New_York])'
  expected: '3'

- description: Inspect ISO day of week
  expression: '(day-of-week 2025-06-01)'
  expected: '7'

- description: Inspect day of year
  expression: '(day-of-year 2025-06-01)'
  expected: '152'

- description: Inspect ISO week of year
  expression: '(week-of-year 2025-06-01)'
  expected: '22'

- description: Inspect days in February
  expression: '(days-in-month 2025-02-01)'
  expected: '28'

- description: Inspect days in a leap year
  expression: '(days-in-year 2024-02-01)'
  expected: '366'

- description: Inspect months in an ISO year
  expression: '(months-in-year 2025-01-01)'
  expected: '12'

- description: Inspect UTC offset
  expression: '(offset 2025-06-01T08:00:00-04:00[America/New_York])'
  expected: '-04:00'

- description: Inspect time-zone identifier
  expression: '(time-zone-id 2025-06-01T08:00:00-04:00[America/New_York])'
  expected: 'America/New_York'

- description: Inspect calendar identifier
  expression: '(calendar-id 2025-01-01)'
  expected: 'iso8601'

- description: Comments and multiline whitespace are accepted
  expression: |
    ; Calculate the next day
    (add
      2025-12-31
      P1D)
  expected: '2026-01-01'

# --- Arithmetic and calendar edge cases ---

- description: Add one year to a leap day constrains to February 28
  expression: '(add 2024-02-29 P1Y)'
  expected: '2025-02-28'

- description: Constrain overflow when adding a month to the 31st
  expression: '(add 2025-03-31 P1M :overflow "constrain")'
  expected: '2025-04-30'

- description: Days in a non-leap year
  expression: '(days-in-year 2025-01-01)'
  expected: '365'

- description: Day of year on the last day of a non-leap year
  expression: '(day-of-year 2025-12-31)'
  expected: '365'

- description: ISO day of week for New Year's Day 2025 is Wednesday
  expression: '(day-of-week 2025-01-01)'
  expected: '3'

- description: Round an instant up to the nearest hour
  expression: '(round 2025-06-01T12:34:56Z :smallest-unit "hour")'
  expected: '2025-06-01T13:00:00Z'

# --- Time zones and DST ---

- description: Convert an instant into a half-hour-offset zone
  expression: '(with-time-zone 2025-06-01T12:00:00Z "Asia/Kolkata")'
  expected: '2025-06-01T17:30:00+05:30[Asia/Kolkata]'

- description: Elapsed hours across the fall-back overlap exceed the wall-clock gap
  expression: '(subtract 2025-11-02T12:00:00-05:00[America/New_York] 2025-11-02T00:00:00-04:00[America/New_York] :largest-unit "hours")'
  expected: 'PT13H'

- description: A calendar day before the spring-forward day equals 24 hours
  expression: '(compare P1D PT24H :relative-to 2025-03-08T00:00:00-05:00[America/New_York])'
  expected: '0'

- description: A calendar day starting on the spring-forward day is shorter than 24 hours
  expression: '(compare P1D PT24H :relative-to 2025-03-09T00:00:00-05:00[America/New_York])'
  expected: '-1'

# --- Deeply nested expressions ---

- description: Convert to an instant then read the local hour in another zone
  expression: '(hour (with-time-zone (to-instant 2025-06-01T08:00:00-04:00[America/New_York]) "Asia/Tokyo"))'
  expected: '21'

- description: A calendar-day addition precedes a 24-hour addition across spring-forward
  expression: '(compare (add 2025-03-08T12:00:00-05:00[America/New_York] P1D) (add 2025-03-08T12:00:00-05:00[America/New_York] PT24H))'
  expected: '-1'

# --- Context operators (now / default-time-zone) ---

- description: now returns the provided clock instant
  expression: '(now)'
  now: '2026-09-02T15:30:00Z'
  expected: '2026-09-02T15:30:00Z'

- description: default-time-zone returns the provided zone
  expression: '(default-time-zone)'
  defaultTimeZone: 'America/Los_Angeles'
  expected: 'America/Los_Angeles'

- description: Current date recipe resolves now in the context zone
  expression: '(to-date (with-time-zone (now) (default-time-zone)))'
  now: '2026-09-02T03:30:00Z'
  defaultTimeZone: 'America/Los_Angeles'
  expected: '2026-09-01'

- description: Current day of month in the context zone
  expression: '(day (with-time-zone (now) (default-time-zone)))'
  now: '2026-09-02T03:30:00Z'
  defaultTimeZone: 'America/Los_Angeles'
  expected: '1'

# --- Error taxonomy ---

- description: Unrecognized literal is a lex error
  expression: '(add 2025-01-31 #P1M)'
  error: 'LEX_ERROR'

- description: Unclosed call is a parse error
  expression: '(add 2025-01-31 P1M'
  error: 'PARSE_ERROR'

- description: Trailing input after the expression is a parse error
  expression: '(add 2025-01-31 P1M) extra'
  error: 'PARSE_ERROR'

- description: Unknown operator is rejected
  expression: '(until 2025-01-01 2025-02-01)'
  error: 'UNKNOWN_OPERATOR'

- description: Wrong number of arguments is an arity error
  expression: '(add 2025-01-31)'
  error: 'ARITY_ERROR'

- description: Unsupported keyword option is rejected
  expression: '(add 2025-01-31 P1M :bogus 1)'
  error: 'UNKNOWN_OPTION'

- description: Repeating a keyword option is a duplicate-option error
  expression: '(subtract 2025-12-31 2025-01-01 :largest-unit "months" :largest-unit "days")'
  error: 'DUPLICATE_OPTION'

- description: Quoting a duration literal makes it a string and mismatches the type
  expression: '(add 2025-01-31 "P1M")'
  error: 'TYPE_MISMATCH'

- description: Comparing operands of different types is a type mismatch
  expression: '(compare 2025-06-01 2025-06-01T12:00:00Z)'
  error: 'TYPE_MISMATCH'

- description: A month out of range is an invalid temporal value
  expression: '(add 2025-13-01 P1M)'
  error: 'INVALID_TEMPORAL_VALUE'

- description: A nonexistent calendar day is an invalid temporal value
  expression: '(add 2025-02-30 P1D)'
  error: 'INVALID_TEMPORAL_VALUE'

- description: A malformed duration literal is an invalid temporal value
  expression: '(add 2025-01-31 P1H)'
  error: 'INVALID_TEMPORAL_VALUE'

- description: Adding calendar months to an instant is an invalid operation
  expression: '(add 2025-06-01T12:00:00Z P1M)'
  error: 'INVALID_TEMPORAL_OPERATION'

- description: Reject overflow onto a nonexistent date is an invalid operation
  expression: '(add 2025-01-31 P1M :overflow "reject")'
  error: 'INVALID_TEMPORAL_OPERATION'

- description: now without a clock is a missing-context error
  expression: '(now)'
  error: 'MISSING_CONTEXT'

- description: default-time-zone without a zone is a missing-context error
  expression: '(default-time-zone)'
  error: 'MISSING_CONTEXT'
